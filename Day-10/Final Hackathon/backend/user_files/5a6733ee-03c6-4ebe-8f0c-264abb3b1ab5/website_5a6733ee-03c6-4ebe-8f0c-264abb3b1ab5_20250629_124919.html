<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Elegant Restaurant Website">
<title>The Gilded Lily Restaurant</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  margin: 0;
  background-color: #f4f4f4;
  color: #333;
  line-height: 1.6;
  transition: background-color 0.3s ease;
}

header {
  background-color: #333;
  color: #fff;
  padding: 20px 0;
  text-align: center;
}

header h1 {
  font-size: 3em;
  margin: 0;
}

nav ul {
  list-style: none;
  padding: 0;
  margin: 20px 0;
}

nav li {
  display: inline;
  margin: 0 10px;
}

nav a {
  color: #fff;
  text-decoration: none;
  transition: color 0.3s ease;
}

nav a:hover {
  color: #ddd;
}

section {
  padding: 20px;
}

.menu-item {
  display: flex;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid #eee;
  padding-bottom: 10px;
}

.menu-item img {
  width: 100px;
  height: 100px;
  margin-right: 20px;
  border-radius: 5px;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.gallery img {
  width: 30%;
  margin: 10px;
  border-radius: 5px;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.3s ease;
}

.gallery img:hover {
  transform: scale(1.05);
}

form {
  display: flex;
  flex-direction: column;
  width: 300px;
  margin: 0 auto;
}

label {
  margin-bottom: 5px;
}

input, textarea {
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 10px;
  background-color: #333;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

button:hover {
  background-color: #555;
}

footer {
  background-color: #333;
  color: #fff;
  padding: 10px 0;
  text-align: center;
}

@media (max-width: 768px) {
  .menu-item {
    flex-direction: column;
    align-items: flex-start;
  }
  .menu-item img {
    margin-bottom: 10px;
  }
  .gallery img {
    width: 45%;
  }
  form {
    width: 100%;
  }
}
</style>
</head>
<body>
<header>
  <h1>The Gilded Lily</h1>
  <nav>
    <ul>
      <li><a href="#menu">Menu</a></li>
      <li><a href="#gallery">Gallery</a></li>
      <li><a href="#reservation">Reservation</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<section id="menu">
  <h2>Our Menu</h2>
  <div class="menu-item">
    <img src="placeholder.jpg" alt="Dish 1">
    <h3>Dish 1</h3>
    <p>Description of Dish 1</p>
  </div>
  <div class="menu-item">
    <img src="placeholder.jpg" alt="Dish 2">
    <h3>Dish 2</h3>
    <p>Description of Dish 2</p>
  </div>
</section>

<section id="gallery">
  <h2>Photo Gallery</h2>
  <div class="gallery">
    <img src="placeholder.jpg" alt="Image 1">
    <img src="placeholder.jpg" alt="Image 2">
    <img src="placeholder.jpg" alt="Image 3">
    <img src="placeholder.jpg" alt="Image 4">
  </div>
</section>

<section id="reservation">
  <h2>Make a Reservation</h2>
  <form>
    <label for="name">Name:</label>
    <input type="text" id="name" required>
    <label for="email">Email:</label>
    <input type="email" id="email" required>
    <label for="date">Date:</label>
    <input type="date" id="date" required>
    <label for="time">Time:</label>
    <input type="time" id="time" required>
    <label for="guests">Number of Guests:</label>
    <input type="number" id="guests" required>
    <button type="submit">Submit</button>
  </form>
</section>

<section id="contact">
  <h2>Contact Us</h2>
  <p>Address: 123 Main Street</p>
  <p>Phone: (555) 123-4567</p>
  <p>Email: info@example.com</p>
</section>

<footer>
  <p>&copy; 2023 The Gilded Lily</p>
</footer>
</body>
</html>
