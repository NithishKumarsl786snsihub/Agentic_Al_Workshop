<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="E-commerce Website">
<title>E-commerce Store</title>
<style>
body { font-family: 'Arial', sans-serif; margin: 0; background-color: #f4f4f4; }
header { background-color: #333; color: white; padding: 1rem 0; text-align: center; }
h1 { margin: 0; font-size: 2rem; }
nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; }
nav li { margin: 0 1rem; }
nav a { text-decoration: none; color: white; }
main { display: flex; flex-wrap: wrap; justify-content: space-around; padding: 20px; }
.product { width: 300px; margin-bottom: 20px; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s ease; }
.product img { width: 100%; height: auto; }
.product h2 { margin: 10px 0; }
.product p { margin: 5px 0; }
.product button { background-color: #333; color: white; padding: 10px 20px; border: none; cursor: pointer; transition: background-color 0.2s ease; }
.product button:hover { background-color: #555; }
.product:hover { transform: translateY(-5px); }
.cart { position: fixed; top: 0; right: 0; background-color: white; width: 300px; height: 100%; transform: translateX(100%); transition: transform 0.3s ease; }
.cart.open { transform: translateX(0); }
.cart-header { background-color: #333; color: white; padding: 1rem; }
.cart-items { padding: 1rem; }
.cart-item { display: flex; justify-content: space-between; margin-bottom: 1rem; }
.cart-total { padding: 1rem; font-weight: bold; }
.cart-button { background-color: #333; color: white; padding: 10px 20px; border: none; cursor: pointer; }
.checkout { text-align: center; padding: 20px; }
.checkout button { background-color: #333; color: white; padding: 10px 20px; border: none; cursor: pointer; }
@media (max-width: 768px) {
  main { flex-direction: column; }
  .product { width: 90%; margin: 10px auto; }
  .cart { width: 100%; }
}
</style>
</head>
<body>
<header>
<h1>E-commerce Store</h1>
<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">Cart</a></li>
</ul>
</nav>
</header>
<main>
<div class="product">
<img src="product1.jpg" alt="Product 1">
<h2>Product 1</h2>
<p>Description of product 1</p>
<button>Add to Cart</button>
</div>
<div class="product">
<img src="product2.jpg" alt="Product 2">
<h2>Product 2</h2>
<p>Description of product 2</p>
<button>Add to Cart</button>
</div>
</main>
<div class="cart">
<div class="cart-header">Shopping Cart</div>
<div class="cart-items"></div>
<div class="cart-total">Total: $0.00</div>
<button class="cart-button">Checkout</button>
</div>
<div class="checkout">
<h2>Checkout</h2>
<button>Proceed to Checkout</button>
</div>
<script>
// Add JavaScript for cart functionality here
</script>
</body>
</html>
