<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="E-commerce Website">
<title>E-commerce Store</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f4f4;
  color: #333;
}
header {
  background-color: #333;
  color: #fff;
  padding: 1rem 0;
  text-align: center;
}
nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
}
nav li {
  display: inline;
  margin: 0 1rem;
}
nav a {
  color: #fff;
  text-decoration: none;
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  grid-gap: 20px;
  padding: 20px;
}
.product {
  border: 1px solid #ddd;
  padding: 10px;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
  transition: transform 0.3s ease;
}
.product:hover {
  transform: translateY(-5px);
}
.product img {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
}
.product-details {
  padding: 10px;
}
.product-details h3 {
  margin-top: 0;
}
.product-details p {
  margin-bottom: 0;
}
.shopping-cart {
  padding: 20px;
  border: 1px solid #ddd;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
}
.checkout {
  text-align: center;
  padding: 20px;
}
.checkout button {
  background-color: #333;
  color: #fff;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
@media (max-width: 768px) {
  .product-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header>
  <h1>E-commerce Store</h1>
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="#">Cart</a></li>
      <li><a href="#">Checkout</a></li>
    </ul>
  </nav>
</header>
<section class="product-grid">
  <div class="product">
    <img src="https://picsum.photos/300/200" alt="Product 1" style="max-width: 100%; height: auto;">
    <div class="product-details">
      <h3>Product 1</h3>
      <p>$29.99</p>
    </div>
  </div>
  <div class="product">
    <img src="https://picsum.photos/300/200" alt="Product 2" style="max-width: 100%; height: auto;">
    <div class="product-details">
      <h3>Product 2</h3>
      <p>$49.99</p>
    </div>
  </div>
  <div class="product">
    <img src="https://picsum.photos/300/200" alt="Product 3" style="max-width: 100%; height: auto;">
    <div class="product-details">
      <h3>Product 3</h3>
      <p>$19.99</p>
    </div>
  </div>
</section>
<section class="shopping-cart">
  <h2>Shopping Cart</h2>
  <p>Your cart is empty.</p>
</section>
<section class="checkout">
  <button>Proceed to Checkout</button>
</section>
</body>
</html>
