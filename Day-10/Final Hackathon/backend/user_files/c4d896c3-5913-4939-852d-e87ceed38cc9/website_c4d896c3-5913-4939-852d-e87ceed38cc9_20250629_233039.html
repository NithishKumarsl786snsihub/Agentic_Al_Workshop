<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Modern Portfolio Website">
<title>My Portfolio</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  margin: 0;
  background-color: #1e1e1e;
  color: #eee;
  transition: background-color 0.3s ease;
}

.hero {
  background-image: url("https://picsum.photos/1200/400");
  background-size: cover;
  background-position: center;
  height: 600px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-size: 3em;
  margin-bottom: 0.5em;
}

.hero p {
  font-size: 1.2em;
  margin-bottom: 2em;
}

.section {
  padding: 40px;
  text-align: center;
}

.about img {
  max-width: 300px;
  height: auto;
  border-radius: 50%;
  margin-bottom: 20px;
}

.skills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.skill {
  width: 150px;
  height: 150px;
  margin: 10px;
  background-color: #333;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.2em;
  color: #eee;
  transition: transform 0.3s ease;
}

.skill:hover {
  transform: scale(1.1);
}

.contact form {
  display: flex;
  flex-direction: column;
}

.contact input, .contact textarea {
  padding: 10px;
  margin-bottom: 10px;
  background-color: #333;
  color: #eee;
  border: none;
  border-radius: 5px;
}

.contact button {
  padding: 10px;
  background-color: #5cb85c;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

@media (max-width: 768px) {
  .hero {
    height: 400px;
  }
  .skills {
    flex-direction: column;
    align-items: center;
  }
  .skill {
    width: 100%;
    max-width: 200px;
  }
}
</style>
</head>
<body>
<div class="hero">
  <h1>Welcome to My Portfolio</h1>
  <p>A modern portfolio website showcasing my skills and projects.</p>
</div>

<section class="section about">
  <h2>About Me</h2>
  <img src="https://picsum.photos/400/400" alt="Profile Picture" style="max-width: 100%; height: auto; border-radius: 50%;">
  <p>I am a passionate web developer with expertise in HTML, CSS, and JavaScript. I love creating beautiful and functional websites.</p>
</section>

<section class="section skills">
  <h2>My Skills</h2>
  <div class="skill">HTML</div>
  <div class="skill">CSS</div>
  <div class="skill">JavaScript</div>
  <div class="skill">React</div>
  <div class="skill">Node.js</div>
</section>

<section class="section contact">
  <h2>Contact Me</h2>
  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Your Message" rows="5" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>
</body>
</html>
