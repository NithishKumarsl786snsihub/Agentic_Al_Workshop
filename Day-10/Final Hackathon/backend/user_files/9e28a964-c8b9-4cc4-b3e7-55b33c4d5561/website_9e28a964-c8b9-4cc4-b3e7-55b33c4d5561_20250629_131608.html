<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Modern Portfolio Website">
<title>My Portfolio</title>
<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background-color: #1e1e1e;
  color: #eee;
  transition: background-color 0.3s ease;
}

.hero {
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('hero-image.jpg'); /* Replace with your hero image */
  background-size: cover;
  background-position: center;
  height: 60vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
}

.hero h1 {
  font-size: 3em;
  margin-bottom: 0.5em;
}

.hero p {
  font-size: 1.2em;
  margin-bottom: 1em;
}

.section {
  padding: 2em;
  text-align: center;
}

.skills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.skill {
  background-color: #333;
  padding: 1em 2em;
  margin: 1em;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.skill:hover {
  background-color: #444;
}

.contact-form {
  display: flex;
  flex-direction: column;
}

.contact-form input,
.contact-form textarea {
  padding: 0.8em;
  margin-bottom: 1em;
  border: 1px solid #555;
  border-radius: 5px;
  background-color: #222;
  color: #eee;
}

.contact-form button {
  padding: 0.8em 1.5em;
  background-color: #5cb85c;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.contact-form button:hover {
  background-color: #4cae4c;
}

@media (max-width: 768px) {
  .hero h1 {
    font-size: 2em;
  }
  .hero p {
    font-size: 1em;
  }
  .skills {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>
<body>
<div class="hero">
  <h1>Welcome to My Portfolio</h1>
  <p>I'm a Web Developer & Designer</p>
</div>

<section class="section about">
  <h2>About Me</h2>
  <p>This is a brief description about myself and my experience.</p>
</section>

<section class="section skills">
  <h2>My Skills</h2>
  <div class="skill">HTML</div>
  <div class="skill">CSS</div>
  <div class="skill">JavaScript</div>
  <div class="skill">React</div>
  <div class="skill">Node.js</div>
</section>

<section class="section contact">
  <h2>Contact Me</h2>
  <form class="contact-form">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Your Message" rows="5" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>
</body>
</html>
